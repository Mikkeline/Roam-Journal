name: Verify Roam Journal
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TMPDIR: /tmp/
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Core tests, release build and privacy preflight
        run: bash scripts/verify.sh
      - name: Build UI test app
        timeout-minutes: 15
        run: bash scripts/ui-tests.sh build
      - name: Boot iPhone simulator
        timeout-minutes: 5
        run: python3 scripts/boot-simulator.py
      - name: Install UI test app
        timeout-minutes: 3
        run: bash scripts/ui-tests.sh install
      - name: Run simulator UI tests
        timeout-minutes: 8
        run: bash scripts/ui-tests.sh test
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: /tmp/RoamJournalUIVerification/*.xcresult
          if-no-files-found: ignore
