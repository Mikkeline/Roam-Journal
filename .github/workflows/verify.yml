name: Verify Roam Journal
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Core tests, release build and privacy preflight
        run: bash scripts/verify.sh
      - name: Run simulator UI tests
        shell: bash
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          ROAM_SIMULATOR_ID="$device" bash scripts/ui-tests.sh
